name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The suite tests a third-party site: a daily run detects site changes
  # (and known bugs that get fixed, which turn the test.fail() tests red).
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run that is now outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions pinned to a full commit SHA (supply-chain safety); the comment shows the release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7
